# 构建打包：push/PR 跑测试，打 tag v* 时矩阵构建并把压缩包发布到 GitHub Release。
# 五目标：Linux musl 三件套（zigbuild 交叉编译）+ Windows MSVC + macOS arm64。
# web/dist 已入库，前端产物随源码走，CI 无需 npm。
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag 构建时创建 Release 并上传产物

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # 只取消被新提交取代的 PR 运行

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test

      # e2e.sh 自建 debug 二进制并起本地服务+webhook 接收器（cargo/curl/python3/lsof 均为 runner 预装）
      - name: End-to-end tests
        run: bash tests/e2e.sh

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一个目标失败不影响其余目标产出
      matrix:
        include:
          # platform = 产物文件名（对用户友好）；target = Rust 目标三元组（编译用）
          # ⚠️ 暂时只构建 linux-arm64（Pi 64 位）；其余四个目标临时关闭，需恢复时取消注释
          # - target: x86_64-unknown-linux-musl # 通用 Linux 服务器（静态链接）
          #   platform: linux-amd64
          #   os: ubuntu-latest
          #   zig: true
          - target: aarch64-unknown-linux-musl # 树莓派 64 位系统 / ARM 云主机
            platform: linux-arm64
            os: ubuntu-latest
            zig: true
          # - target: armv7-unknown-linux-musleabihf # 树莓派 32 位系统（armhf；纯 musl 目标无预编译 std）
          #   platform: linux-armv7
          #   os: ubuntu-latest
          #   zig: true
          # - target: x86_64-pc-windows-msvc # Windows
          #   platform: windows-amd64
          #   os: windows-latest
          #   zig: false
          # - target: aarch64-apple-darwin # macOS Apple Silicon
          #   platform: macos-arm64
          #   os: macos-latest
          #   zig: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # zigbuild 官方推荐的快速安装路径（预编译 wheel，免源码编译）
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: python3 -m pip install --user cargo-zigbuild ziglang

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # tag 推送时用 tag 名（v0.1.0），否则用分支名/PR 号/短 SHA
      - name: Compute version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          EXT=""
          [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe"
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/hummingbird$EXT" stage/
          cp LICENSE README.md stage/
          if [ -n "$EXT" ]; then
            7z a "hummingbird-$VERSION-${{ matrix.platform }}.zip" stage/*
          else
            tar -czf "hummingbird-$VERSION-${{ matrix.platform }}.tar.gz" -C stage hummingbird LICENSE README.md
          fi
          # 逐产物生成 .sha256（scripts/upgrade.sh 据此校验下载完整性）
          # 注意：用 if 而非 [ ] && ——glob 未命中时 [ -e ] 返回 1 会触发 set -e
          for f in hummingbird-*.tar.gz hummingbird-*.zip; do
            if [ -e "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hummingbird-${{ matrix.platform }}
          path: |
            hummingbird-*.tar.gz
            hummingbird-*.zip
            hummingbird-*.sha256

  # 汇总发布（仅 tag）：聚合五平台产物，生成 checksums.txt，
  # 并把校验和写进 Release 正文（正文与附件同批生成，便于人工比对）
  release:
    name: Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        run: |
          cd assets
          # nullglob：被临时关闭的目标不产生文件时，跳过而非报错（bash -e 下裸 glob 会失败）
          shopt -s nullglob
          files=(hummingbird-*.tar.gz hummingbird-*.zip)
          if [ ${#files[@]} -gt 0 ]; then sha256sum "${files[@]}" > checksums.txt; fi
          {
            echo '## 升级'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/canyuda/hummingbird/main/scripts/upgrade.sh | sudo bash'
            echo '```'
            echo
            echo '## 校验和（sha256）'
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } > body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: assets/body.md
          files: |
            assets/hummingbird-*.tar.gz
            assets/hummingbird-*.zip
            assets/hummingbird-*.sha256
            assets/checksums.txt
